<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Dashboard — Marviz</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1420;--p:#161c2e;--p2:#1d263b;--l:#2b3652;--t:#e7edf8;--m:#8d9ab8;--b:#6d9bff;--g:#38d39f;--a:#f5bd43;--r:#fa7777}
*{box-sizing:border-box;margin:0}body{padding:20px 24px;background:var(--bg);color:var(--t);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.header h1{font-size:20px}.header .sub{color:var(--m);font-size:11px;margin-top:3px}
.badge{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:7px 12px;color:var(--m);font-size:11px}
.ask-bar{display:flex;gap:10px;margin-bottom:16px;padding:14px;background:var(--p);border:1px solid var(--l);border-radius:12px}
.ask-bar input{flex:1;padding:11px 14px;border-radius:8px;border:1px solid var(--l);background:var(--p2);color:var(--t);font-size:13px}
.ask-bar input:focus{outline:none;border-color:var(--b)}
.ask-bar button{padding:11px 20px;border-radius:8px;border:none;background:var(--b);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.ask-bar button:hover{opacity:.9}
.ask-bar .mic{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,#2f6d5c,#5fae94);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.ask-bar .mic.recording{box-shadow:0 0 0 6px rgba(47,109,92,.3);transform:scale(1.08)}
.quick-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.quick-bar button{padding:6px 12px;border-radius:7px;border:1px solid var(--l);background:var(--p2);color:var(--m);font-size:11px;cursor:pointer}
.quick-bar button:hover{border-color:var(--b);color:var(--t)}
.widgets{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.widget{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:16px;min-height:200px}
.widget.full{grid-column:1/-1}
.widget h3{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.widget .chart-area{height:220px}
.widget .kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.widget .kpi{text-align:center;padding:12px;background:var(--p2);border-radius:8px}
.widget .kpi .kpi-label{font-size:10px;color:var(--m);text-transform:uppercase}
.widget .kpi .kpi-value{font-size:20px;font-weight:700;margin-top:4px}
.widget table{width:100%;border-collapse:collapse;font-size:11px}
.widget th,.widget td{padding:7px 8px;border-bottom:1px solid var(--l);text-align:right}
.widget th{color:var(--m);font-size:9px;text-transform:uppercase}
.widget th:first-child,.widget td:first-child{text-align:left}
.widget tr:hover td{background:var(--p2)}
.status{font-size:11px;color:var(--m);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--g)}
.empty{text-align:center;padding:80px 20px;color:var(--m)}
.empty h2{font-size:16px;color:var(--t);margin-bottom:8px}
.thinking{color:var(--a);font-style:italic;padding:12px;background:var(--p);border:1px solid var(--l);border-radius:8px;margin-bottom:12px;font-size:12px}
</style></head><body>

<div class="header">
  <div><h1>AI Dashboard Builder</h1><p class="sub">Ask Marviz to build charts, tables, and KPIs — they appear here dynamically</p></div>
  <div class="badge"><span class="dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px" id="status-dot"></span><span id="status-text">connecting...</span></div>
</div>

<div class="ask-bar">
  <button class="mic" id="micBtn">🎤</button>
  <input id="askInput" type="text" placeholder="Ask: 'Show me spend by platform', 'CPP trend chart', 'Campaign table sorted by L2P'..." />
  <button id="askBtn">Generate</button>
</div>

<div class="quick-bar">
  <button onclick="ask('Show me a bar chart of spend by platform for last 14 days')">📊 Spend by Platform</button>
  <button onclick="ask('Create a KPI summary with total spend, leads, payments, CPP, and L2P rate')">🎯 KPI Summary</button>
  <button onclick="ask('Show campaign performance table sorted by CPP')">📋 Campaign Table</button>
  <button onclick="ask('Give me a doughnut chart of budget allocation across Search, Meta, Pmax')">🍩 Budget Split</button>
  <button onclick="ask('Show CPP by campaign as a horizontal bar chart, highlight those above ₹2700 target')">⚠️ CPP Analysis</button>
  <button onclick="ask('Create a leadership view: KPIs on top, then platform breakdown chart')">👔 Leadership View</button>
</div>

<div id="thinking" class="thinking" style="display:none">Thinking...</div>
<div id="widgets" class="widgets"></div>
<div id="empty" class="empty"><h2>Your AI-built dashboard</h2><p>Ask Marviz to create charts, tables, or KPIs. Each response adds a widget here.</p></div>

<script>
const widgets=document.getElementById('widgets');
const empty=document.getElementById('empty');
const thinking=document.getElementById('thinking');
const statusDot=document.getElementById('status-dot');
const statusText=document.getElementById('status-text');
let chartInstances={};

const params=new URLSearchParams(location.search);
const marvizHost=params.get('marviz')||localStorage.getItem('marviz_url')||null;
const MARVIZ_WS=marvizHost?marvizHost.replace('https://','wss://').replace('http://','ws://')+'/ws/marviz':'ws://localhost:8000/ws/marviz';
if(marvizHost)localStorage.setItem('marviz_url',marvizHost);

// Also fetch data from dashboard APIs for the AI to reference
let LIVE_DATA=null;
async function fetchLiveData(){
  const[meta,google]=await Promise.all([
    fetch('/api/meta?action=overall&product=rize').then(r=>r.json()).catch(()=>null),
    fetch('/api/metrics?view=overall&business=rize&product=rize').then(r=>r.json()).catch(()=>null)
  ]);
  LIVE_DATA={meta,google};
}
fetchLiveData();

let ws=null,pendingResponse='';

function connect(){
  ws=new WebSocket(MARVIZ_WS);
  ws.onopen=()=>{statusDot.style.background='#38d39f';statusText.textContent='connected'};
  ws.onerror=()=>{statusDot.style.background='#fa7777';statusText.textContent='offline — start Marviz on port 8000'};
  ws.onclose=()=>{statusDot.style.background='#f5bd43';statusText.textContent='disconnected'};
  ws.onmessage=(e)=>{
    const d=JSON.parse(e.data);
    if(d.type==='text_chunk'){pendingResponse+=d.text;return}
    if(d.text_response){
      thinking.style.display='none';
      pendingResponse=d.text_response;
      renderWidget(pendingResponse);
      pendingResponse='';
    }
  };
}

function ask(text){
  if(!text)return;
  document.getElementById('askInput').value='';
  if(!ws||ws.readyState!==WebSocket.OPEN){
    // Fallback: generate widget from local data without Marviz
    thinking.textContent='Generating from local data...';
    thinking.style.display='block';
    setTimeout(()=>{generateLocalWidget(text);thinking.style.display='none'},500);
    return;
  }
  thinking.textContent='Marviz is analyzing data and building your widget...';
  thinking.style.display='block';
  pendingResponse='';
  // Augment the prompt to ask for structured widget output
  const augmented=text+'\n\nIMPORTANT: After your analysis, output a JSON widget spec wrapped in ```json ... ``` with this structure: {"widget_type":"bar|doughnut|table|kpi","title":"...","data":{...}} where data matches the widget type. For bar/doughnut: {"labels":[],"datasets":[{"label":"","data":[],"backgroundColor":""}]}. For table: {"headers":[],"rows":[[]]}. For kpi: {"items":[{"label":"","value":""}]}';
  ws.send(JSON.stringify({type:'text',text:augmented}));
}

function generateLocalWidget(query){
  if(!LIVE_DATA)return;
  const q=query.toLowerCase();
  const meta=LIVE_DATA.meta,google=LIVE_DATA.google;
  const gS=google?.summary||{},mS=meta?.summary||{};

  if(q.includes('spend')&&q.includes('platform')){
    addChartWidget('bar','Spend by Platform',[
      'Google Search','Meta','Google Pmax'
    ],[{label:'Spend (₹L)',data:[parseFloat(gS.total_spend||0)/100000,mS.total_spend/100000||0,0],backgroundColor:['#3f86f5','#ad8cff','#22d3ee']}]);
  } else if(q.includes('kpi')||q.includes('summary')){
    addKPIWidget('Performance Summary',[
      {label:'Total Spend',value:'₹'+(((parseFloat(gS.total_spend)||0)+(mS.total_spend||0))/100000).toFixed(2)+'L'},
      {label:'Leads',value:String((parseInt(gS.total_leads)||0)+(mS.total_leads||0))},
      {label:'Payments',value:String((parseInt(gS.total_payments)||0)+(mS.total_conversions||0))},
    ]);
  } else if(q.includes('table')||q.includes('campaign')){
    const camps=(google?.campaigns||[]).slice(0,8);
    addTableWidget('Campaign Performance',['Campaign','Spend','Leads','Payments','CPP'],
      camps.map(c=>[c.campaign_name?.slice(0,35)||'—','₹'+(parseFloat(c.spend||0)/1000).toFixed(1)+'K',c.leads||0,c.payments||0,parseInt(c.payments)>0?'₹'+Math.round(parseFloat(c.spend||0)/parseInt(c.payments)):'—']));
  } else if(q.includes('doughnut')||q.includes('split')||q.includes('allocation')){
    addChartWidget('doughnut','Budget Allocation',['Search','Meta','Pmax'],
      [{data:[parseFloat(gS.total_spend||0),mS.total_spend||0,0],backgroundColor:['#3f86f5','#ad8cff','#22d3ee']}]);
  } else {
    addKPIWidget('Quick Answer',[{label:'Response',value:'Ask something more specific about spend, campaigns, or performance'}]);
  }
}

function renderWidget(text){
  // Try to extract JSON from the response
  const jsonMatch=text.match(/```json\s*([\s\S]*?)```/);
  if(jsonMatch){
    try{
      const spec=JSON.parse(jsonMatch[1]);
      if(spec.widget_type==='bar'||spec.widget_type==='line')addChartWidget(spec.widget_type,spec.title,spec.data.labels,spec.data.datasets);
      else if(spec.widget_type==='doughnut')addChartWidget('doughnut',spec.title,spec.data.labels,spec.data.datasets);
      else if(spec.widget_type==='table')addTableWidget(spec.title,spec.data.headers,spec.data.rows);
      else if(spec.widget_type==='kpi')addKPIWidget(spec.title,spec.data.items);
      else addTextWidget(text);
      return;
    }catch(e){}
  }
  // No JSON found — render as text insight + try local generation
  addTextWidget(text);
}

function addChartWidget(type,title,labels,datasets){
  empty.style.display='none';
  const id='chart-'+Date.now();
  const full=type==='doughnut'?'':'full';
  const div=document.createElement('div');
  div.className='widget '+full;
  div.innerHTML=`<h3>${title}</h3><div class="chart-area"><canvas id="${id}"></canvas></div>`;
  widgets.prepend(div);
  setTimeout(()=>{
    const el=document.getElementById(id);if(!el)return;
    chartInstances[id]=new Chart(el,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8d9ab8',boxWidth:10}}},scales:type==='doughnut'?{}:{x:{ticks:{color:'#6b7085'},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#6b7085'},grid:{color:'rgba(255,255,255,.04)'}}}}});
  },50);
}

function addKPIWidget(title,items){
  empty.style.display='none';
  const div=document.createElement('div');
  div.className='widget full';
  div.innerHTML=`<h3>${title}</h3><div class="kpi-grid">${items.map(i=>`<div class="kpi"><div class="kpi-label">${i.label}</div><div class="kpi-value">${i.value}</div></div>`).join('')}</div>`;
  widgets.prepend(div);
}

function addTableWidget(title,headers,rows){
  empty.style.display='none';
  const div=document.createElement('div');
  div.className='widget full';
  div.innerHTML=`<h3>${title}</h3><table><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table>`;
  widgets.prepend(div);
}

function addTextWidget(text){
  empty.style.display='none';
  const div=document.createElement('div');
  div.className='widget full';
  div.innerHTML=`<h3>AI Insight</h3><p style="color:var(--t);font-size:12px;line-height:1.5;white-space:pre-wrap">${text.replace(/```json[\s\S]*?```/g,'').trim()}</p>`;
  widgets.prepend(div);
}

// Event listeners
document.getElementById('askBtn').addEventListener('click',()=>{ask(document.getElementById('askInput').value.trim())});
document.getElementById('askInput').addEventListener('keydown',(e)=>{if(e.key==='Enter')ask(document.getElementById('askInput').value.trim())});

// Mic
let isRecording=false,mediaRecorder=null,audioChunks=[];
document.getElementById('micBtn').addEventListener('mousedown',async()=>{
  if(isRecording)return;isRecording=true;
  document.getElementById('micBtn').classList.add('recording');
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm'});audioChunks=[];
  mediaRecorder.ondataavailable=(e)=>{if(e.data.size>0)audioChunks.push(e.data)};
  mediaRecorder.onstop=()=>{
    const blob=new Blob(audioChunks,{type:'audio/webm'});
    if(ws&&ws.readyState===WebSocket.OPEN){ws.send(blob);thinking.textContent='Transcribing & building widget...';thinking.style.display='block'}
    stream.getTracks().forEach(t=>t.stop());
  };
  mediaRecorder.start();
});
function stopMic(){if(!isRecording)return;isRecording=false;document.getElementById('micBtn').classList.remove('recording');if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop()}
document.getElementById('micBtn').addEventListener('mouseup',stopMic);
document.getElementById('micBtn').addEventListener('mouseleave',stopMic);

connect();
</script></body></html>
