<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rize Performance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1420;--p:#161c2e;--p2:#1d263b;--l:#2b3652;--t:#e7edf8;--m:#8d9ab8;--b:#6d9bff;--g:#38d39f;--a:#f5bd43;--r:#fa7777}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--t);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1,h2,p{margin:0}.header{display:flex;justify-content:space-between;margin-bottom:18px}.header h1{font-size:24px}.sub,.meta{color:var(--m);font-size:12px;margin-top:5px}.badge,.controls,.card,.panel{background:var(--p);border:1px solid var(--l);border-radius:12px}.badge{padding:9px 12px;color:var(--m);font-size:12px}.badge b{color:var(--t)}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;margin-bottom:18px}.controls label{color:var(--m);font-size:12px}.controls select{background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:7px;padding:7px 10px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{padding:16px}.label{font-size:11px;color:var(--m);text-transform:uppercase}.value{font-size:25px;font-weight:700;margin-top:7px}.delta{font-size:12px;margin-top:5px}.up{color:var(--g)}.down{color:var(--r)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.full{grid-template-columns:1fr}.panel{padding:16px}.panel h2{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between}.chart{height:285px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--l);text-align:right;white-space:nowrap}th{color:var(--m);font-size:10px;text-align:left;text-transform:uppercase}td:first-child,th:first-child{text-align:left}tr:hover td{background:var(--p2)}.note{border-left:3px solid var(--b);background:var(--p2);padding:10px 12px;color:#cbd5e1;margin-top:12px}.loading{text-align:center;padding:60px;color:var(--m)}@media(max-width:900px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="header"><div><h1>Rize — Performance Dashboard</h1><p class="sub">Live data · Google Ads + Meta + DataGaaru Backend</p></div><div class="badge"><b>Source</b> All Channels</div></div>
<div class="controls"><label>Dashboard view</label><select id="role"><option value="internal">Internal / Marketing Ops</option><option value="manager">Manager</option><option value="leadership">Leadership</option></select><label>Representation</label><select id="repr"><option value="graphic">Graphic</option><option value="table">Table</option></select><span id="viewText" class="sub">Detailed channel, campaign, and creative diagnostics</span></div>
<div id="app"><div class="loading">Loading live data...</div></div>

<!-- Marviz Voice Agent Panel -->
<div id="marviz-dock" style="position:fixed;bottom:0;left:0;right:0;background:var(--p);border-top:1px solid var(--l);padding:14px 24px;z-index:100;display:flex;align-items:center;gap:16px">
  <button id="micBtn" style="width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(135deg,#2f6d5c,#5fae94);color:white;font-size:20px;cursor:pointer;flex-shrink:0" title="Hold to talk">🎤</button>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;gap:8px">
      <input id="textInput" type="text" placeholder="Ask Marviz about spend, ROAS, campaigns..." style="flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--l);background:var(--p2);color:var(--t);font-size:13px" />
      <button id="sendBtn" style="padding:10px 18px;border-radius:10px;border:none;background:var(--b);color:white;font-size:13px;font-weight:600;cursor:pointer">Send</button>
    </div>
    <div id="marviz-response" style="font-size:12px;color:var(--m);max-height:60px;overflow-y:auto;line-height:1.4"></div>
  </div>
  <div id="marviz-status" style="font-size:11px;color:var(--m);min-width:80px;text-align:right">connecting...</div>
</div>
<div style="height:90px"></div><!-- spacer for fixed dock -->
<script>
let DATA=null, ch={};
const money=n=>{if(n>=100000)return'₹'+(n/100000).toFixed(2)+'L';if(n>=1000)return'₹'+(n/1000).toFixed(1)+'K';return'₹'+Math.round(n)};

async function loadData(){
  const[metaRes,googleRes]=await Promise.all([
    fetch('/api/meta?action=overall&product=rize').then(r=>r.json()).catch(()=>null),
    fetch('/api/metrics?view=overall&business=rize&product=rize').then(r=>r.json()).catch(()=>null)
  ]);
  const gS=googleRes?.summary||{},mS=metaRes?.summary||{};
  const googleSpend=parseFloat(gS.total_spend)||0,metaSpend=mS.total_spend||0;
  const googleLeads=parseInt(gS.total_leads)||0,metaLeads=mS.total_leads||0;
  const googlePay=parseInt(gS.total_payments)||0,metaPay=mS.total_conversions||0;
  const totalSpend=googleSpend+metaSpend,totalLeads=googleLeads+metaLeads,totalPay=googlePay+metaPay;

  // Platform breakdown
  const platforms={Search:{s:0,l:0,p:0,i:0,c:0},Meta:{s:metaSpend,l:metaLeads,p:metaPay,i:mS.total_impressions||0,c:mS.total_clicks||0},Pmax:{s:0,l:0,p:0,i:0,c:0}};
  for(const c of(googleRes?.campaigns||[])){
    const plat=(c.platform||'').toLowerCase().includes('pmax')?'Pmax':'Search';
    platforms[plat].s+=parseFloat(c.spend||'0');
    platforms[plat].l+=parseInt(c.leads||'0');
    platforms[plat].p+=parseInt(c.payments||'0');
    platforms[plat].i+=parseInt(c.impressions||'0');
    platforms[plat].c+=parseInt(c.clicks||'0');
  }

  DATA={totalSpend,totalLeads,totalPay,
    cac:totalPay>0?totalSpend/totalPay:0,
    l2p:totalLeads>0?(totalPay/totalLeads)*100:0,
    cpl:totalLeads>0?totalSpend/totalLeads:0,
    platforms,
    campaigns:[...(googleRes?.campaigns||[]).map(c=>({...c,source:'Google'})),...(metaRes?.campaigns||[]).map(c=>({...c,source:'Meta',leads:c.leads||0,payments:c.conversions||0}))]
      .sort((a,b)=>parseFloat(b.spend||'0')-parseFloat(a.spend||'0'))
  };
  build();
}

function clean(){Object.values(ch).forEach(x=>x.destroy());ch={}}
function T(h,rows){return'<div class="table-wrap"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function mk(id,type,labels,sets,opt={}){
  if(document.getElementById('repr').value==='table'){
    let heads=[''],rows=labels.map((l,i)=>[l]);
    sets.forEach(s=>{heads.push(s.label||'');rows.forEach((r,i)=>r.push(typeof s.data[i]==='number'?s.data[i].toFixed(1):s.data[i]))});
    document.getElementById(id).parentElement.innerHTML=T(heads,rows);return;
  }
  const el=document.getElementById(id);if(!el)return;
  ch[id]=new Chart(el,{type,data:{labels,datasets:sets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8d9ab8',boxWidth:12}}},scales:type==='doughnut'?{}:{x:{ticks:{color:'#8d9ab8'},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#8d9ab8'},grid:{color:'rgba(255,255,255,.04)'}}},...opt}})
}
function k(label,val,subtitle){return'<div class="card"><div class="label">'+label+'</div><div class="value">'+val+'</div><div class="delta up">'+subtitle+'</div></div>'}
function KP(){return'<div class="kpis">'+k('Spend',money(DATA.totalSpend),'Live from APIs')+k('Payments',DATA.totalPay.toLocaleString(),'Backend verified')+k('CAC',money(DATA.cac),'Cost per Payment')+k('Lead → Payment',DATA.l2p.toFixed(1)+'%','Conversion rate')+'</div>'}
function platformTable(){
  const P=DATA.platforms;
  return T(['Platform','Spend','Leads','Payments','CPL','CPP','L→P %','Share'],
    Object.entries(P).map(([n,x])=>[n,money(x.s),x.l,x.p,x.l>0?money(x.s/x.l):'—',x.p>0?money(x.s/x.p):'—',x.l>0?((x.p/x.l)*100).toFixed(1)+'%':'—',(x.s/DATA.totalSpend*100).toFixed(1)+'%']))
}
function campTable(limit){
  return T(['Campaign','Platform','Spend','Leads','Payments','CPP','Share'],
    DATA.campaigns.slice(0,limit).map(c=>{const s=parseFloat(c.spend||'0'),l=parseInt(c.leads||'0'),p=parseInt(c.payments||c.conversions||'0');
      return[c.campaign_name?.slice(0,45)||'—',c.source||c.platform||'—',money(s),l,p,p>0?money(s/p):'—',(s/DATA.totalSpend*100).toFixed(1)+'%']}))
}

function internal(){return KP()+'<div class="grid"><div class="panel"><h2>Platform Performance Breakdown</h2><div class="chart"><canvas id="pp"></canvas></div>'+platformTable()+'</div><div class="panel"><h2>Cost Metrics by Platform</h2><div class="chart"><canvas id="cm"></canvas></div></div></div><div class="grid full"><div class="panel"><h2>Campaign-level Performance</h2>'+campTable(15)+'</div></div>'}
function manager(){return KP()+'<div class="grid"><div class="panel"><h2>Spends vs Payments vs CAC</h2><div class="chart"><canvas id="mm"></canvas></div></div><div class="panel"><h2>Platform Mix <span class="meta">spend allocation</span></h2><div class="chart"><canvas id="mx"></canvas></div></div></div><div class="grid full"><div class="panel"><h2>Platform Performance Breakdown</h2><div class="chart"><canvas id="mp"></canvas></div>'+platformTable()+'</div></div><div class="grid full"><div class="panel"><h2>Top-performing Campaigns</h2>'+campTable(8)+'</div></div>'}
function leadership(){return KP()+'<div class="grid"><div class="panel"><h2>Overall Performance</h2><div class="chart"><canvas id="lm"></canvas></div></div><div class="panel"><h2>Channel Allocation</h2><div class="chart"><canvas id="lx"></canvas></div></div></div><div class="grid full"><div class="panel"><h2>Platform Performance Breakdown</h2><div class="chart"><canvas id="lp"></canvas></div>'+platformTable()+'<div class="note">Executive view emphasizes outcomes, payment sources, and channel allocation. Data sourced from Google Ads API + Meta Marketing API + DataGaaru backend.</div></div></div>'}

function build(){
  if(!DATA)return;
  clean();
  const r=document.getElementById('role').value;
  document.getElementById('viewText').textContent=r==='internal'?'Detailed channel, campaign, and creative diagnostics':r==='manager'?'Management view: CAC, mix, channels, and top campaigns':'Executive view: outcomes, payment sources, and allocation';
  const app=document.getElementById('app');
  app.innerHTML=r==='internal'?internal():r==='manager'?manager():leadership();

  const P=DATA.platforms,pNames=Object.keys(P);
  if(r==='internal'){
    mk('pp','bar',pNames,[
      {label:'Spend (₹L)',data:pNames.map(n=>P[n].s/100000),backgroundColor:'#3f86f5'},
      {label:'Leads',data:pNames.map(n=>P[n].l),backgroundColor:'#22c55e'},
      {label:'Payments',data:pNames.map(n=>P[n].p),backgroundColor:'#f5a400'},
      {label:'CPP (₹K)',data:pNames.map(n=>P[n].p>0?P[n].s/P[n].p/1000:0),backgroundColor:'#ef4444'}
    ]);
    mk('cm','bar',pNames,[
      {label:'CPC',data:pNames.map(n=>P[n].c>0?P[n].s/P[n].c:0),backgroundColor:'#35d7e8'},
      {label:'CPL',data:pNames.map(n=>P[n].l>0?P[n].s/P[n].l:0),backgroundColor:'#f5bd43'},
      {label:'CPP',data:pNames.map(n=>P[n].p>0?P[n].s/P[n].p:0),backgroundColor:'#fa7777'}
    ]);
  }
  if(r==='manager'){
    mk('mm','bar',pNames,[
      {label:'Spend (₹L)',data:pNames.map(n=>P[n].s/100000),backgroundColor:'#6d9bff'},
      {label:'Payments',data:pNames.map(n=>P[n].p),backgroundColor:'#38d39f'},
      {type:'line',label:'CAC (₹K)',data:pNames.map(n=>P[n].p>0?P[n].s/P[n].p/1000:0),borderColor:'#fa7777'}
    ]);
    mk('mx','doughnut',pNames,[{data:pNames.map(n=>P[n].s),backgroundColor:['#3f86f5','#ad8cff','#22d3ee']}],{plugins:{legend:{position:'right'}}});
    mk('mp','bar',pNames,[
      {label:'Spend (₹L)',data:pNames.map(n=>P[n].s/100000),backgroundColor:'#3f86f5'},
      {label:'Leads',data:pNames.map(n=>P[n].l),backgroundColor:'#22c55e'},
      {label:'Payments',data:pNames.map(n=>P[n].p),backgroundColor:'#f5a400'},
      {label:'CPP (₹K)',data:pNames.map(n=>P[n].p>0?P[n].s/P[n].p/1000:0),backgroundColor:'#ef4444'}
    ]);
  }
  if(r==='leadership'){
    mk('lm','bar',pNames,[
      {label:'Spend (₹L)',data:pNames.map(n=>P[n].s/100000),backgroundColor:'#6d9bff'},
      {label:'Payments',data:pNames.map(n=>P[n].p),backgroundColor:'#38d39f'}
    ]);
    mk('lx','doughnut',pNames,[{data:pNames.map(n=>P[n].s),backgroundColor:['#3f86f5','#ad8cff','#22d3ee']}],{plugins:{legend:{position:'right'}}});
    mk('lp','bar',pNames,[
      {label:'Spend (₹L)',data:pNames.map(n=>P[n].s/100000),backgroundColor:'#3f86f5'},
      {label:'Leads',data:pNames.map(n=>P[n].l),backgroundColor:'#22c55e'},
      {label:'Payments',data:pNames.map(n=>P[n].p),backgroundColor:'#f5a400'},
      {label:'CPP (₹K)',data:pNames.map(n=>P[n].p>0?P[n].s/P[n].p/1000:0),backgroundColor:'#ef4444'}
    ]);
  }
}
document.getElementById('role').addEventListener('change',build);
document.getElementById('repr').addEventListener('change',build);
loadData();

// --- Marviz Voice Agent Integration ---
(function(){
  const MARVIZ_WS_URL = 'ws://localhost:8000/ws/marviz';
  const statusEl = document.getElementById('marviz-status');
  const responseEl = document.getElementById('marviz-response');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  let ws = null, mediaRecorder = null, audioChunks = [], isRecording = false;

  function connect() {
    ws = new WebSocket(MARVIZ_WS_URL);
    ws.onopen = () => { statusEl.textContent = '● connected'; statusEl.style.color = '#38d39f'; };
    ws.onerror = () => { statusEl.textContent = '● offline'; statusEl.style.color = '#fa7777'; };
    ws.onclose = () => { statusEl.textContent = '● disconnected'; statusEl.style.color = '#f5bd43'; };
    ws.onmessage = (e) => {
      const d = JSON.parse(e.data);
      if (d.type === 'text_chunk') {
        responseEl.textContent += d.text;
        return;
      }
      if (d.text_response) {
        responseEl.innerHTML = '<b>Marviz:</b> ' + d.text_response;
        if (window.speechSynthesis) {
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(d.text_response));
        }
      }
      if (d.dashboard_payload) {
        // Refresh dashboard data when Marviz returns metrics
        loadData();
      }
    };
  }

  function sendText(text) {
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    responseEl.innerHTML = '<i style="color:#8d9ab8">Thinking...</i>';
    ws.send(JSON.stringify({ type: 'text', text }));
  }

  sendBtn.addEventListener('click', () => { sendText(textInput.value.trim()); textInput.value = ''; });
  textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { sendText(textInput.value.trim()); textInput.value = ''; } });

  // Voice recording
  micBtn.addEventListener('mousedown', async () => {
    if (isRecording) return;
    isRecording = true;
    micBtn.style.boxShadow = '0 0 0 8px rgba(47,109,92,0.3)';
    micBtn.style.transform = 'scale(1.1)';
    statusEl.textContent = '● listening...';
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      if (ws && ws.readyState === WebSocket.OPEN) { ws.send(blob); responseEl.innerHTML = '<i style="color:#8d9ab8">Transcribing & thinking...</i>'; }
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
  });
  function stopMic() {
    if (!isRecording) return;
    isRecording = false;
    micBtn.style.boxShadow = 'none';
    micBtn.style.transform = 'scale(1)';
    statusEl.textContent = '● connected';
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  }
  micBtn.addEventListener('mouseup', stopMic);
  micBtn.addEventListener('mouseleave', stopMic);

  connect();
})();
</script></body></html>
