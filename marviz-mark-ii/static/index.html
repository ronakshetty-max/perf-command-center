<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Marviz Mark II — Voice Ads Assistant</title>
<style>
  :root {
    --bg: #f4f8f6;
    --panel: #ffffff;
    --border: #e3ece8;
    --ink: #16241f;
    --muted: #7d938b;
    --accent: #2f6d5c;
    --accent-soft: #e6f3ee;
    --accent-dark: #1f4438;
    --green: #17c383;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Inter", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  .shell {
    display: grid;
    grid-template-columns: 240px 1fr 300px;
    min-height: 100vh;
  }

  /* ---------- Left sidebar ---------- */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand .logo {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #5fae94);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 15px;
  }
  .brand .name { font-weight: 700; font-size: 15px; }
  .brand .sub {
    font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 4px;
  }
  .brand .sub::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block;
  }

  .nav-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 600; margin-bottom: 10px;
  }
  .quick-prompts { display: flex; flex-direction: column; gap: 8px; }
  .quick-prompt {
    text-align: left;
    background: var(--accent-soft);
    border: none;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--accent-dark);
    cursor: pointer;
    transition: background 0.15s;
  }
  .quick-prompt:hover { background: #d7ebe3; }

  .platform-toggle { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
  .platform-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; padding: 8px 10px; border-radius: 10px; background: #f2f8f5;
  }

  /* ---------- Center panel ---------- */
  .main {
    display: flex;
    flex-direction: column;
    padding: 24px 32px;
    min-width: 0;
  }
  .main-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  }
  .main-header h1 { font-size: 18px; margin: 0; }
  .main-header .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #status-pill {
    font-size: 12px; padding: 5px 12px; border-radius: 20px; background: var(--accent-soft);
    color: var(--accent-dark); font-weight: 600;
  }
  #status-pill.connected { background: #e3faf0; color: #0c8f5c; }
  #status-pill.error { background: #ffe9e9; color: #c23d3d; }

  .transcript-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    flex: 1;
    padding: 20px 24px;
    overflow-y: auto;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .transcript-card:empty::before {
    content: "Ask Marviz Mark II about spend, ROAS, or campaigns — or hold the mic below.";
    color: var(--muted); font-size: 14px;
  }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
  .bubble.you { align-self: flex-end; background: var(--accent); color: white; border-radius: 14px 14px 4px 14px; }
  .bubble.marviz { align-self: flex-start; background: #ecf5f1; color: var(--ink); border-radius: 14px 14px 14px 4px; }
  .bubble.payload {
    align-self: flex-start; background: transparent; border: 1px dashed var(--border);
    color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace;
    white-space: pre-wrap; max-width: 92%;
  }
  .bubble.thinking { color: var(--muted); font-style: italic; }
  .bubble.thinking .dots::after {
    content: "";
    animation: thinking-dots 1.2s steps(4, end) infinite;
  }
  @keyframes thinking-dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }

  /* ---------- Voice control dock ---------- */
  .voice-dock {
    margin-top: 18px;
    background: var(--accent-dark);
    border-radius: var(--radius);
    padding: 22px 26px;
    display: flex;
    align-items: center;
    gap: 20px;
    color: white;
  }
  #waveform {
    flex: 1;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 3px;
    overflow: hidden;
  }
  #waveform .bar {
    flex: 1;
    min-width: 2px;
    max-width: 5px;
    border-radius: 3px;
    background: #3d5750;
    height: 6px;
    transition: height 0.05s ease-out, background 0.15s;
  }
  #waveform .bar.live { background: var(--accent); }

  #micBtn {
    flex-shrink: 0;
    width: 64px; height: 64px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), #5fae94);
    color: white;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(47, 109, 92, 0.5);
    transition: box-shadow 0.2s, transform 0.1s;
  }
  #micBtn.recording {
    box-shadow: 0 0 0 10px rgba(47, 109, 92, 0.25);
    transform: scale(1.05);
  }
  #micBtn:active { transform: scale(0.96); }

  .voice-hint { font-size: 11px; color: #8fada3; min-width: 90px; text-align: right; }

  .text-fallback {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  #textInput {
    flex: 1;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 13px;
    background: var(--panel);
  }
  #textInput:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #sendBtn {
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    background: var(--accent-soft);
    color: var(--accent-dark);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:hover { background: #d7ebe3; }

  /* ---------- Right sidebar ---------- */
  .rightbar {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .rightbar h2 { font-size: 14px; margin: 0 0 4px; }
  .metric-card {
    background: #f2f8f5;
    border-radius: 14px;
    padding: 14px 16px;
  }
  .metric-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .metric-card .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .metric-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .empty-metrics {
    font-size: 12px; color: var(--muted); background: #f2f8f5; border-radius: 14px; padding: 14px 16px;
  }

  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar, .rightbar { display: none; }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- Left sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <div class="name">Marviz Mark II</div>
        <div class="sub" id="conn-sub">connecting</div>
      </div>
    </div>

    <div>
      <div class="nav-label">Quick prompts</div>
      <div class="quick-prompts">
        <button class="quick-prompt" data-prompt="How much did we spend this week?">💰 Spend this week</button>
        <button class="quick-prompt" data-prompt="What's my ROAS by platform?">📊 ROAS by platform</button>
        <button class="quick-prompt" data-prompt="List my active campaigns.">📣 Active campaigns</button>
        <button class="quick-prompt" data-prompt="Show me top performing ads.">🏆 Top performing ads</button>
      </div>
    </div>

    <div class="platform-toggle">
      <div class="nav-label">Data sources</div>
      <div class="platform-row"><span>Google Ads</span><span>●</span></div>
      <div class="platform-row"><span>Meta Ads</span><span>●</span></div>
    </div>
  </aside>

  <!-- Center -->
  <main class="main">
    <div class="main-header">
      <div>
        <h1>Ask Marviz Mark II</h1>
        <div class="meta">Voice ad-analytics assistant · read-only</div>
      </div>
      <div id="status-pill">connecting…</div>
    </div>

    <div class="transcript-card" id="log"></div>

    <div class="voice-dock">
      <button id="micBtn" title="Hold to talk">🎤</button>
      <div id="waveform"></div>
      <div class="voice-hint" id="voice-hint">Hold to talk</div>
    </div>

    <div class="text-fallback">
      <input id="textInput" type="text" placeholder="…or type your question" />
      <button id="sendBtn">Send</button>
    </div>
  </main>

  <!-- Right sidebar -->
  <aside class="rightbar">
    <div>
      <h2>Live metrics</h2>
      <div id="metrics-panel">
        <div class="empty-metrics">Ask about spend or ROAS to see numbers here.</div>
      </div>
    </div>
  </aside>

</div>

<script src="marvizClient.js"></script>
<script>
  const log = document.getElementById("log");
  const statusPill = document.getElementById("status-pill");
  const connSub = document.getElementById("conn-sub");
  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("micBtn");
  const voiceHint = document.getElementById("voice-hint");
  const waveformEl = document.getElementById("waveform");
  const metricsPanel = document.getElementById("metrics-panel");

  // Build a fixed set of equalizer bar elements once; drawWaveform just
  // updates their heights each frame (cheaper + easier to style than canvas).
  const BAR_COUNT = 40;
  const bars = [];
  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement("div");
    bar.className = "bar";
    waveformEl.appendChild(bar);
    bars.push(bar);
  }

  function drawWaveform(dataArray) {
    if (!dataArray) {
      bars.forEach((bar) => {
        bar.style.height = "6px";
        bar.classList.remove("live");
      });
      return;
    }
    const step = Math.floor(dataArray.length / BAR_COUNT);
    for (let i = 0; i < BAR_COUNT; i++) {
      const sample = dataArray[i * step] || 128;
      const amplitude = Math.abs(sample - 128) / 128; // 0..1
      const height = Math.max(6, amplitude * 52);
      bars[i].style.height = `${height}px`;
      bars[i].classList.add("live");
    }
  }

  function addMsg(who, text, cls) {
    const div = document.createElement("div");
    div.className = `bubble ${cls}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // Tracks the in-progress Marviz reply bubble across the "thinking..."
  // placeholder -> streamed-text -> final-response lifecycle of one turn.
  let pendingBubble = null;

  function startPendingReply() {
    const div = document.createElement("div");
    div.className = "bubble marviz thinking";
    div.innerHTML = 'Thinking<span class="dots"></span>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    pendingBubble = div;
    return div;
  }

  function appendToPendingReply(textChunk) {
    if (!pendingBubble) startPendingReply();
    if (pendingBubble.classList.contains("thinking")) {
      pendingBubble.classList.remove("thinking");
      pendingBubble.textContent = "";
    }
    pendingBubble.textContent += textChunk;
    log.scrollTop = log.scrollHeight;
  }

  function finalizePendingReply(finalText) {
    if (!pendingBubble) {
      addMsg("Marviz Mark II", finalText, "marviz");
      return;
    }
    pendingBubble.classList.remove("thinking");
    pendingBubble.textContent = finalText;
    pendingBubble = null;
    log.scrollTop = log.scrollHeight;
  }

  function renderMetrics(payload) {
    if (!payload) return;
    metricsPanel.innerHTML = "";

    if (payload.type === "metrics" && payload.combined) {
      const combined = payload.combined;
      const entries = Object.entries(combined).slice(0, 4);
      entries.forEach(([key, value]) => {
        const card = document.createElement("div");
        card.className = "metric-card";
        card.innerHTML = `
          <div class="label">${key.replace(/_/g, " ")}</div>
          <div class="value">${typeof value === "number" ? value.toLocaleString() : value}</div>
          <div class="sub">${payload.date_range || ""}</div>
        `;
        metricsPanel.appendChild(card);
      });
    } else {
      const card = document.createElement("div");
      card.className = "metric-card";
      card.innerHTML = `<div class="label">${payload.type || "update"}</div><div class="sub">${JSON.stringify(payload).slice(0, 120)}</div>`;
      metricsPanel.appendChild(card);
    }
  }

  // Indian currency shorthand (₹7.6L, ₹1.2Cr, ₹144.6K) reads fine as text but
  // browser TTS doesn't know "L"/"Cr" are unit words. Worse than just
  // spelling out the letter: some voices apply currency-decimal parsing to
  // "₹61.2" (like treating .2 as cents) and read it as "61 rupees and 2
  // lakhs" — wrong by five orders of magnitude, not just clunky. So this
  // fully resolves the number to its integer rupee value first, then
  // decomposes THAT into crore/lakh/thousand/hundred groups as plain words
  // — no decimal point ever reaches the TTS engine. The visible chat bubble
  // keeps the compact ₹7.6L notation untouched; only speech is rewritten.
  const INDIAN_UNITS = [
    ["crore", 1_00_00_000],
    ["lakh", 1_00_000],
    ["thousand", 1_000],
    ["hundred", 100],
  ];

  function pluralizeIndianUnit(word, count) {
    // "lakh"/"crore" commonly pluralize in Indian English ("2 lakhs"); "hundred"/
    // "thousand" conventionally don't ("20 thousand", not "20 thousands").
    if (word === "crore" || word === "lakh") return count === 1 ? word : `${word}s`;
    return word;
  }

  function numberToIndianWords(value) {
    let remaining = Math.round(value);
    if (remaining <= 0) return "zero";
    const parts = [];
    for (const [word, unitValue] of INDIAN_UNITS) {
      const count = Math.floor(remaining / unitValue);
      if (count > 0) {
        parts.push(`${count} ${pluralizeIndianUnit(word, count)}`);
        remaining -= count * unitValue;
      }
    }
    if (remaining > 0) parts.push(`${remaining}`);
    return parts.join(" ");
  }

  const CURRENCY_SUFFIX_VALUES = { Cr: 1_00_00_000, L: 1_00_000, K: 1_000 };
  function toSpeakableText(text) {
    return text.replace(
      // Consumes a leading ₹ (if present) into the match too, so it's
      // removed from the output — otherwise a leftover symbol could still
      // get read as "rupees" a second time, on top of the one this adds.
      /₹?\s*(\d+(?:\.\d+)?)\s*(Cr|L|K)\b/g,
      (_match, number, suffix) => {
        const totalRupees = parseFloat(number) * CURRENCY_SUFFIX_VALUES[suffix];
        return `${numberToIndianWords(totalRupees)} rupees`;
      }
    );
  }

  function speak(text) {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(toSpeakableText(text)));
  }

  const client = new MarvizWebVoiceClient(
    `ws://${window.location.host}/ws/marviz`,
    (payload) => renderMetrics(payload)
  );

  client.onAudioLevel = drawWaveform;

  // For text input, the "You" bubble is added synchronously when sending
  // (we already know what was typed), so onMessage must not add it again.
  // For voice input, the transcript is only known once Gemini STT finishes
  // server-side, so it's shown for the first time here, in onMessage.
  let transcriptAlreadyShown = false;

  client.onTextChunk = (textChunk) => {
    appendToPendingReply(textChunk);
  };

  client.onMessage = (response) => {
    if (response.transcript && !transcriptAlreadyShown) {
      addMsg("You", response.transcript, "you");
    }
    transcriptAlreadyShown = false;
    finalizePendingReply(response.text_response);
    speak(response.text_response);
  };

  client.connect().then(() => {
    statusPill.textContent = "connected";
    statusPill.classList.add("connected");
    connSub.textContent = "connected";
  }).catch(() => {
    statusPill.textContent = "connection failed";
    statusPill.classList.add("error");
    connSub.textContent = "offline";
  });

  function sendQuestion(text) {
    if (!text) return;
    addMsg("You", text, "you");
    transcriptAlreadyShown = true;
    startPendingReply();
    client.sendText(text);
  }

  function sendCurrentText() {
    const text = textInput.value.trim();
    if (!text) return;
    sendQuestion(text);
    textInput.value = "";
  }

  sendBtn.addEventListener("click", sendCurrentText);
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendCurrentText();
  });

  document.querySelectorAll(".quick-prompt").forEach((btn) => {
    btn.addEventListener("click", () => {
      sendQuestion(btn.dataset.prompt);
    });
  });

  let isRecording = false;

  micBtn.addEventListener("mousedown", () => {
    isRecording = true;
    micBtn.classList.add("recording");
    voiceHint.textContent = "Listening…";
    client.startRecording();
  });
  function releaseMic() {
    if (!isRecording) return; // guards mouseleave firing without a prior mousedown
    isRecording = false;
    micBtn.classList.remove("recording");
    voiceHint.textContent = "Hold to talk";
    client.stopRecording();
    // Voice turns don't know the transcript client-side (STT runs
    // server-side) — show the "thinking" placeholder now so there's
    // feedback immediately, and let onMessage add the "You" bubble once
    // the transcript comes back.
    transcriptAlreadyShown = false;
    startPendingReply();
  }
  micBtn.addEventListener("mouseup", releaseMic);
  micBtn.addEventListener("mouseleave", releaseMic);
</script>
</body>
</html>
